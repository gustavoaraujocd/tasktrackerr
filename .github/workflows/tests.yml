name: Test Harness

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e .[dev]
      - run: pytest -q --cov --cov-report=term-missing --cov-report=xml --cov-report=html --junitxml=test-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-results
          path: |
            test-results.xml
            coverage.xml
            htmlcov/

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose
        run: docker compose config
      - name: Build runtime
        run: docker build -t tasktracker:phase3 .
      - name: Smoke test runtime
        shell: bash
        run: |
          test "$(docker run --rm --entrypoint id tasktracker:phase3 -u)" = "10001"
          printf '2\n3\n' | docker run --rm -i tasktracker:phase3 > /tmp/tasktracker-smoke.log
          cat /tmp/tasktracker-smoke.log
          grep -q "Nenhuma tarefa cadastrada" /tmp/tasktracker-smoke.log
          grep -q "Encerrando o TaskTracker" /tmp/tasktracker-smoke.log
      - name: Test in container
        run: |
          docker compose build tests
          docker compose run --rm -T tests
